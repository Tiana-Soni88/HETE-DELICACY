<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Now | Hete Delicacy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">Hete Delicacy ★★★★★</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms & Suites</a></li>
      <li><a href="contact.html" class="active">Book Now</a></li>
    </ul>
  </nav>

  <section class="page-header">
    <h1>Reserve Your Stay</h1>
  </section>

  <section class="booking-section">
    <form id="bookingForm" class="booking-form">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <select id="roomType" required>
        <option value="">Select Room Type</option>
        <option value="Deluxe">Deluxe Room</option>
        <option value="Executive">Executive Suite</option>
        <option value="Presidential">Presidential Suite</option>
      </select>
      <input type="date" id="checkIn" required />
      <input type="date" id="checkOut" required />
      <textarea id="message" placeholder="Special Requests (optional)"></textarea>
      <button type="submit" class="btn">Confirm Reservation</button>
    </form>
    <p id="statusMessage"></p>
  </section>

  <footer>
    <p>© 2025 Hete Delicacy Hotel. All rights reserved.</p>
  </footer>

  <script type="module" src="booking.js"></script>
</body>
</html>
