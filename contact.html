<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Now | Hete Delicacy</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="animations.css" />
</head>
<body>
  <nav class="navbar">
    <div class="logo">HETE DELICACY ★★★★★</div>
    <button class="nav-toggle">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="dining.html">Dining</a></li>
      <li><a href="spa.html">Spa</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="offers.html">Offers</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active">Book Now</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <h1>Reserve Your Stay</h1>
    <p>Our concierge will confirm within 24 hours</p>
  </div>

  <section>
    <form id="bookingForm" class="booking-form">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <select id="roomType" required>
        <option value="">Select Room Type</option>
        <option value="deluxe">Deluxe Room — $500/night</option>
        <option value="executive">Executive Suite — $850/night</option>
        <option value="presidential">Presidential Suite — $1500/night</option>
      </select>
      <input type="date" id="checkIn" placeholder="Check-in" required />
      <input type="date" id="checkOut" placeholder="Check-out" required />
      <textarea id="message" placeholder="Special requests (optional)"></textarea>
      <p id="estimate"></p>
      <button type="submit" class="btn">Confirm Reservation</button>
    </form>
    <p id="statusMessage" class="status"></p>
  </section>

  <footer>
    <div class="footer-bottom">© 2025 Hete Delicacy Hotel. All rights reserved.</div>
  </footer>
<a href="admin.html" class="admin-float" title="Admin Access" aria-label="Admin Access">⚙</a>
  <script type="module" src="booking.js"></script>
</body>
</html>
